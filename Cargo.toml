[package]
name = "surf"
version = "0.1.0"
edition = "2024"
description = "Fast, ultra-low-token browser automation daemon & CLI for AI agents via CDP"

[[bin]]
name = "surf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "process", "signal", "macros"] }
tokio-tungstenite = "0.26"

[profile.release]
lto = true
codegen-units = 1
strip = true
